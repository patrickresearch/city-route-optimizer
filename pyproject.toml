[project]
name = "city-route-optimizer"
version = "0.1.0"
description = "Capacitated vehicle routing with time windows on real OpenStreetMap street networks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "folium>=0.17",
    "kaleido>=1.0",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "ortools>=9.10",
    "osmnx>=2.0",
    "pandas>=2.2",
    "plotly>=5.24",
    "scipy>=1.13",
    "shapely>=2.0",
    "streamlit>=1.40",
    "streamlit-folium>=0.22",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cityroute"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]
